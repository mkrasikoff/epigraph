plugins {
    id 'com.android.application'
}

// Signing material is kept out of git. Copy keystore.properties.template to
// keystore.properties (gitignored) and fill it in after generating the upload keystore.
// Without that file, debug builds still work and `assembleRelease` produces an unsigned APK.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.mkrasikoff.epigraph'
    compileSdk 34

    defaultConfig {
        applicationId "com.mkrasikoff.epigraph"
        minSdk 21          // Trusted Web Activity requires API 21+
        targetSdk 34       // Android 14 — required floor for new Play Store submissions
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed only when keystore.properties is present (see above); otherwise the
            // release APK is unsigned. Debug builds are always signed with the debug key.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's TWA support library — provides LauncherActivity, splash handling,
    // Digital Asset Links verification, and notification delegation.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
