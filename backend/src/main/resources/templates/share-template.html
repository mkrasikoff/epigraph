<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{OG_DESCRIPTION}}">
    <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#18160f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f2ec" id="theme-color-meta">
    <script src="/js/themes.js"></script>
    <script>
        (function () {
            var theme = null, themeStyle = 'classic';
            try {
                theme = localStorage.getItem('theme');
                var s = localStorage.getItem('themeStyle');
                if (s && THEME_STYLE_KEYS.indexOf(s) !== -1) themeStyle = s;
            } catch (e) {}
            var dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme:dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme-style', themeStyle);
        })();
    </script>
    <title>{{OG_TITLE}}</title>
    <link rel="icon" href="/icon.png" type="image/png">

    <!-- Open Graph / Social Preview — server-rendered per quote, see SharePageController -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:image" content="https://epigraph.me/og-image.png">
    <meta property="og:site_name" content="Epigraph">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{OG_TITLE}}">
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
    <meta name="twitter:image" content="https://epigraph.me/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .share-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: oklch(from var(--color-bg) l c h / 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-divider);
            padding: var(--space-3) var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
        }
        /* Mirrors .qod-section exactly (same wrapper the real QoD screen uses) — flex column,
           centered text, no gap between children. Spacing between the card and the actions row
           below it comes only from .qod-actions' own margin-top, same as the main app; adding a
           flex gap here on top of that would double it. */
        .share-body {
            position: relative;
            min-height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-12) var(--space-6);
            text-align: center;
        }
        .share-body .qod-card {
            cursor: default;
        }
        /* Icon-only "this is a public, view-only quote" indicator — top-right corner of the
           card, click reveals a short explanation. Deliberately not a text pill: a filled
           colored badge sitting above the quote competed for attention with the quote itself
           (design iteration, TASK-125). */
        .share-badge-icon {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            background: var(--color-primary-highlight);
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition), color var(--transition);
        }
        .share-badge-icon:hover {
            background: var(--color-primary);
            color: var(--color-text-inverse);
        }
        /* background/color use the app's own surface+border pair (same as e.g. dropdown menus)
           rather than the stark var(--color-text)/var(--color-bg) inversion .toast uses — a
           full black-on-white (or white-on-black) swap read as too harsh for a small
           explanatory tooltip. Both tokens are theme-style-aware, so this adapts automatically
           across forest/cosmos/ocean/sunset, not just light/dark. white-space:pre-line forces
           the two-sentence hint onto two lines regardless of viewport width — see the literal
           newline in the sharePublicHint translation string (i18n.js). */
        .share-badge-tooltip {
            position: absolute;
            top: calc(var(--space-4) + 34px);
            right: var(--space-4);
            max-width: 15rem;
            padding: var(--space-2) var(--space-3);
            background: var(--color-surface-2);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: var(--text-xs);
            line-height: 1.4;
            text-align: left;
            white-space: pre-line;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(-4px);
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 1;
        }
        .share-badge-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body>

<!-- THEME DECOR — same fixed animated background as index.html, one group per theme style -->
<div id="theme-decor" aria-hidden="true">
    <div class="decor decor-classic">
        <span class="decor-glyph" style="--x:6%; --dur:34s; --delay:-4s;">&ldquo;</span>
        <span class="decor-glyph" style="--x:22%; --dur:29s; --delay:-14s;">&rdquo;</span>
        <span class="decor-glyph" style="--x:40%; --dur:38s; --delay:-2s;">&rdquo;</span>
        <span class="decor-glyph" style="--x:58%; --dur:26s; --delay:-18s;">&ldquo;</span>
        <span class="decor-glyph" style="--x:76%; --dur:33s; --delay:-9s;">&ldquo;</span>
        <span class="decor-glyph" style="--x:90%; --dur:31s; --delay:-22s;">&rdquo;</span>
    </div>
    <div class="decor decor-forest">
        <span class="decor-leaf" style="--x:4%; --dur:13s; --delay:-3s;"></span>
        <span class="decor-leaf" style="--x:16%; --dur:17s; --delay:-9s;"></span>
        <span class="decor-leaf" style="--x:30%; --dur:14s; --delay:-1s;"></span>
        <span class="decor-leaf" style="--x:45%; --dur:19s; --delay:-11s;"></span>
        <span class="decor-leaf" style="--x:60%; --dur:15s; --delay:-6s;"></span>
        <span class="decor-leaf" style="--x:74%; --dur:18s; --delay:-14s;"></span>
        <span class="decor-leaf" style="--x:87%; --dur:16s; --delay:-4s;"></span>
        <span class="decor-leaf" style="--x:96%; --dur:20s; --delay:-8s;"></span>
    </div>
    <div class="decor decor-cosmos">
        <span class="decor-star" style="--x:5%; --y:10%; --dur:3.2s; --delay:-1s;"></span>
        <span class="decor-star" style="--x:14%; --y:32%; --dur:4.1s; --delay:-2s;"></span>
        <span class="decor-star" style="--x:24%; --y:60%; --dur:3.6s; --delay:-3s;"></span>
        <span class="decor-star" style="--x:33%; --y:18%; --dur:4.6s; --delay:-1.5s;"></span>
        <span class="decor-star" style="--x:44%; --y:75%; --dur:3.9s; --delay:-2.5s;"></span>
        <span class="decor-star" style="--x:53%; --y:40%; --dur:4.3s; --delay:-0.5s;"></span>
        <span class="decor-star" style="--x:63%; --y:12%; --dur:3.4s; --delay:-3.5s;"></span>
        <span class="decor-star" style="--x:71%; --y:55%; --dur:4.8s; --delay:-1.8s;"></span>
        <span class="decor-star" style="--x:80%; --y:28%; --dur:3.7s; --delay:-2.2s;"></span>
        <span class="decor-star" style="--x:90%; --y:68%; --dur:4.2s; --delay:-0.8s;"></span>
        <span class="decor-star" style="--x:96%; --y:20%; --dur:3.9s; --delay:-3.2s;"></span>
        <span class="decor-shooting"></span>
    </div>
    <div class="decor decor-ocean">
        <span class="decor-bubble" style="--x:6%; --size:10px; --dur:15s; --delay:-2s;"></span>
        <span class="decor-bubble" style="--x:18%; --size:16px; --dur:19s; --delay:-8s;"></span>
        <span class="decor-bubble" style="--x:31%; --size:8px; --dur:13s; --delay:-4s;"></span>
        <span class="decor-bubble" style="--x:47%; --size:13px; --dur:17s; --delay:-11s;"></span>
        <span class="decor-bubble" style="--x:61%; --size:9px; --dur:14s; --delay:-6s;"></span>
        <span class="decor-bubble" style="--x:74%; --size:18px; --dur:20s; --delay:-13s;"></span>
        <span class="decor-bubble" style="--x:86%; --size:11px; --dur:16s; --delay:-3s;"></span>
        <span class="decor-bubble" style="--x:95%; --size:14px; --dur:18s; --delay:-9s;"></span>
    </div>
    <div class="decor decor-sunset">
        <span class="decor-blob decor-blob-1"></span>
        <span class="decor-blob decor-blob-2"></span>
        <span class="decor-blob decor-blob-3"></span>
    </div>
</div>

<header class="share-header">
    <a class="logo" href="#" onclick="flipLogoIcon(); return false;">
        <svg id="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
            <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/>
        </svg>
        Epigraph
    </a>
    <div class="header-actions">
        <button class="btn-icon" id="share-theme-toggle" aria-label="Переключить тему" data-i18n-aria="ariaToggleTheme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn-icon" id="share-lang-toggle" data-lang-toggle aria-label="Переключить язык" data-i18n-aria="ariaToggleLanguage">EN</button>
        <button class="btn-secondary" onclick="window.location.href='/'" data-i18n="shareOpenApp">Открыть Epigraph</button>
    </div>
</header>
<div class="share-body">
    <div class="qod-bg-ornament"></div>
    {{BODY}}
</div>
<div id="toast-wrap" class="toast-wrap"></div>
<script src="/js/i18n.js"></script>
<script src="/js/share.js"></script>
</body>
</html>
