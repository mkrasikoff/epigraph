<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{OG_DESCRIPTION}}">
    <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#18160f" media="(prefers-color-scheme: dark)">
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) {}
            var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme:dark)').matches);
            if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <title>{{OG_TITLE}}</title>
    <link rel="icon" href="/icon.png" type="image/png">

    <!-- Open Graph / Social Preview — server-rendered per quote, see SharePageController -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:image" content="https://epigraph.me/og-image.png">
    <meta property="og:site_name" content="Epigraph">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{OG_TITLE}}">
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
    <meta name="twitter:image" content="https://epigraph.me/og-image.png">

    <link rel="stylesheet" href="/styles.css">
    <style>
        .share-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-4);
            padding: var(--space-6);
        }
        .share-page .quote-card {
            max-width: 32rem;
            width: 100%;
        }
        .quote-card-badge {
            display: inline-block;
            padding: 2px var(--space-3);
            background: var(--color-primary-highlight);
            color: var(--color-primary);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: var(--space-4);
        }
        .share-page .btn-primary {
            max-width: 32rem;
            width: 100%;
        }
        .share-open-app {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }
    </style>
</head>
<body>
<div class="share-page">
    {{BODY}}
    <a class="share-open-app" href="/" data-i18n="shareOpenApp">Открыть Epigraph</a>
</div>
<div id="toast-wrap" class="toast-wrap"></div>
<script src="/i18n.js"></script>
<script src="/share.js"></script>
</body>
</html>
