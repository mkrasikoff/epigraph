# ===== PROD PROFILE (Railway) =====

spring:
  # Postgres: Railway injects these variables automatically
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  # Liquibase
  liquibase:
    change-log: classpath:db/db-changelog.yaml

  # JPA: validate schema only, never auto-alter in prod
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # Google OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          yandex:
            client-id: ${YANDEX_CLIENT_ID}
            client-secret: ${YANDEX_CLIENT_SECRET}
            scope: login:email, login:info
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/yandex"
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info?format=json
            user-name-attribute: id

app:
  base-url: https://epigraph.me
  # check user ip (hide/show login methods for different countries)
  geo:
    enabled: true
    blocked-countries: RU

  # Notification banner message
  banner:
    message: ${BANNER_MESSAGE:}

  # Email Verification
  mail:
    from: ${MAIL_FROM}
  resend:
    api-key: ${RESEND_API_KEY}

# http -> https requests
server:
  forward-headers-strategy: framework

# Logging: suppress noise, keep app-level INFO and above
logging:
  level:
    root: WARN
    com.mkrasikoff.epigraph: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
