<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#18160f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f2ec" id="theme-color-meta">
    <script src="/js/themes.js"></script>
    <script>
        // Same early theme/style application as index.html and share-template.html — avoids a
        // flash of the wrong theme before first paint.
        (function () {
            var theme = null, themeStyle = 'classic';
            try {
                theme = localStorage.getItem('theme');
                var s = localStorage.getItem('themeStyle');
                if (s && THEME_STYLE_KEYS.indexOf(s) !== -1) themeStyle = s;
            } catch (e) {}
            var dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme:dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme-style', themeStyle);
            if (dark) document.getElementById('theme-color-meta').setAttribute('content', '#18160f');
        })();
    </script>
    <title>Epigraph — 404</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .not-found-body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--space-6);
            gap: var(--space-5);
        }

        .not-found-mark {
            font-family: var(--font-display);
            font-size: 96px;
            line-height: 1;
            color: var(--color-primary);
            opacity: 0.85;
        }

        .not-found-title {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            color: var(--color-text);
        }

        .not-found-text {
            max-width: 32ch;
            color: var(--color-text-muted);
            font-size: var(--text-base);
        }

        .not-found-home-btn {
            margin-top: var(--space-2);
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-6);
            border-radius: var(--radius-full);
            background: var(--color-primary);
            color: var(--color-text-inverse);
            text-decoration: none;
            font-size: var(--text-sm);
            font-weight: 500;
            transition: background var(--transition);
        }

        .not-found-home-btn:hover {
            background: var(--color-primary-hover);
        }
    </style>
</head>
<body>
<div class="not-found-body">
    <div class="not-found-mark" aria-hidden="true">&rdquo;&nbsp;&rdquo;</div>
    <h1 class="not-found-title" data-i18n="notFoundTitle">Страница не найдена</h1>
    <p class="not-found-text" data-i18n="notFoundText">
        Похоже, эта страница потерялась между цитатами. Такой страницы не существует.
    </p>
    <a class="not-found-home-btn" href="/" data-i18n="notFoundHomeBtn">На главную</a>
</div>

<script src="/js/i18n.js"></script>
<script>
    applyI18n();
</script>
</body>
</html>
